name: ci

# 持续集成质量门禁：分支推送 + Pull Request 均触发。
# 构建发布（多平台安装包）由 release.yml 在 v* 标签时执行。
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 固定到与本地一致 (npm 11.6.2)
          node-version: 24.12.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Run tests
        run: npx vitest run

      - name: Build static app
        run: npm run build
