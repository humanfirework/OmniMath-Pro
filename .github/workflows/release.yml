name: release

# 触发条件：推送 v* 标签时构建并发布多平台安装包
# 也可在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-14"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ github.ref_name }}
          releaseName: "OmniMath Pro ${{ github.ref_name }}"
          releaseBody: |
            OmniMath Pro ${{ github.ref_name }} 桌面端安装包

            | 平台 | 推荐下载 |
            |---|---|
            | Windows | `OmniMath-Pro_***_x64-setup.exe` / `.msi` |
            | macOS (Apple Silicon / M 系列) | `OmniMath-Pro_***_aarch64.dmg` |
            | macOS (Intel) | `OmniMath-Pro_***_x64.dmg` |
            | Linux | `OmniMath-Pro_***_amd64.deb` / `.AppImage` |

            文件名中包含版本号 `${{ github.ref_name }}` 和目标平台，请根据你的系统选择对应安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
