<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="OmniMath Pro logo">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- 外环：∞ 无穷符号（Omni 的完整与无限），透明背景 -->
  <g transform="translate(50,50)" fill="none" stroke="url(#omniGrad)" stroke-width="4.5" stroke-linecap="round">
    <!-- 左环 -->
    <ellipse cx="-15" cy="0" rx="13" ry="10.5" transform="rotate(-12 -15 0)"/>
    <!-- 右环 -->
    <ellipse cx="15" cy="0" rx="13" ry="10.5" transform="rotate(12 15 0)"/>
  </g>

  <!-- 中心：Σ 求和符号（Math 的核心运算） -->
  <g transform="translate(50,50)" fill="url(#sigmaGrad)">
    <!-- 简化的 Σ 形状：上横、左斜、右斜、下横 -->
    <path d="M -7 -9 L 8 -9 L 8 -6 L -3 0 L 8 6 L 8 9 L -7 9 L -7 6 L 3 0 L -7 -6 Z"
          opacity="0.9"/>
  </g>

  <!-- 四角数学点缀：小圆点代表数学的精确性 -->
  <circle cx="20" cy="20" r="1.8" fill="#2dd4bf" opacity="0.6"/>
  <circle cx="80" cy="20" r="1.8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="20" cy="80" r="1.8" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="80" cy="80" r="1.8" fill="#3b82f6" opacity="0.6"/>
</svg>
