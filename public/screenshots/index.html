<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniMath Pro 截图预览</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e5e5e5; font-family:system-ui,sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(680px,1fr)); gap:24px; padding:32px; }
  .card { background:#141414; border:1px solid #262626; border-radius:12px; overflow:hidden; }
  .card h3 { margin:0; padding:16px 20px; font-size:14px; color:#a3a3a3; border-bottom:1px solid #262626; }
  .card img { width:100%; display:block; }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><h3>Workbench 工作台</h3><img src="workbench.png"></div>
  <div class="card"><h3>2D 绘图（参数滑块 + 自动交点）</h3><img src="plot2d.png"></div>
  <div class="card"><h3>求解器独立工作台（分步求导）</h3><img src="solver.png"></div>
  <div class="card"><h3>线性代数工作台</h3><img src="linear-algebra.png"></div>
  <div class="card"><h3>3D 曲面绘图</h3><img src="plot3d.png"></div>
  <div class="card"><h3>结构化高级设置</h3><img src="settings.png"></div>
  <div class="card"><h3>浮动计算器</h3><img src="calculator.png"></div>
</div>
</body>
</html>
